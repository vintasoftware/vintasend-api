[project]
name = "vintasend-api"
version = "3.5.0"
description = "REST API that exposes a VintaSend notification service over HTTP for the VintaSend dashboard UI"
authors = [{ name = "Vinta Software", email = "contact@vinta.com.br" }]
license = "MIT"
readme = "README.md"
# Bounded above by Django rather than by vintasend (which supports 3.14):
# the Django 5.2 LTS line tops out at 3.13.
requires-python = ">=3.10,<3.15"
keywords = ["vintasend", "notifications", "django", "django-ninja", "api"]
# No "License ::" classifier: `license` is an SPDX expression (PEP 639), which supersedes
# license classifiers, and the two together are an error to stricter tools and indexes.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
# Constraints stay under [tool.poetry.dependencies] to keep caret syntax, which
# is not valid PEP 621. 'dynamic' tells build tooling the real list lives there.
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/vintasoftware/vintasend-api"
Repository = "https://github.com/vintasoftware/vintasend-api"
Issues = "https://github.com/vintasoftware/vintasend-api/issues"
Changelog = "https://github.com/vintasoftware/vintasend/blob/main/RELEASE_NOTES.md"

[tool.poetry]
# One package: the embeddable app (vintasend_api.dashboard) and the bundled project that
# runs it on its own (settings, urls, wsgi, asgi). manage.py stays out: it is a checkout
# convenience, and an installed package runs Django's commands through
# `python -m django --settings=vintasend_api.settings` instead.
packages = [{ include = "vintasend_api" }]
# The test suite runs from a checkout and is no use to a host, so neither distribution
# carries it.
exclude = ["vintasend_api/**/tests", "vintasend_api/**/tests/**"]
# openapi.yaml goes in the sdist, with the source it describes, and not in the wheel.
# Nothing reads it at runtime: the routes declare their responses themselves and Ninja
# serves the schema it generates from them at /api/v1/openapi.json. A wheel can only carry
# it inside the package directory (anywhere else lands loose in site-packages), and the
# copy in the repository root has to stay where it is, byte-identical to the TypeScript
# reference's.
include = [{ path = "openapi.yaml", format = "sdist" }]

[tool.poetry.dependencies]
vintasend = "3.5.0"
django = ">=4.2,<6.0"
django-ninja = "^1.4.3"
requests = "^2.34.2"
# Reads the .env file in development. Production deployments set real environment
# variables instead, so this is only ever a convenience.
python-dotenv = "^1.1.1"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-django = "^4.11.1"
pytest-xdist = {version = "^3.8.0", extras=["psutil"]}
pytest-cov = "^7.1.0"
tox = "^4.55.0"
# Makes the [gh] section in tox.ini effective: each CI job then runs only the
# envs mapped to its interpreter instead of every env it can find one for.
tox-gh = "^1.8.0"
ruff = "^0.15.22"
mypy = "^2.3.0"
django-stubs = "^5.2.0"
types-requests = "^2.32.0"

[build-system]
# 2.0 is the first poetry-core to read the PEP 621 [project] table.
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vintasend_api.settings"
python_files = ["test_*.py"]
testpaths = ["vintasend_api"]

[tool.ruff]
line-length = 100
indent-width = 4
# Must track the MINIMUM Python in [tool.poetry.dependencies]. Setting this higher
# lets pyupgrade rewrite code into syntax that breaks the older interpreters this
# project still supports.
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "N", "UP", "B", "S", "BLE", "A", "I", "G", "INP", "RUF"]
ignore = [
    "E501",
    # Allow `except Exception`: the error handler deliberately catches everything so a
    # backend failure becomes an INTERNAL_ERROR envelope instead of a stack trace.
    "BLE001",
    "RUF100",
    "UP035",
    "UP037",
]

[tool.ruff.lint.isort]
section-order = ["future", "standard-library", "django", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
"django" = ["django", "ninja"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F403", "F405"]
"**/tests/*" = ["S", "N802", "N815"]
# The wire contract is written with camelCase attribute names on purpose: the schema
# classes are meant to be read side by side with `openapi.yaml` and with the TypeScript
# reference's `src/contract/types.ts`. Renaming them to snake_case with aliases would
# hide the one thing these classes exist to make obvious.
"vintasend_api/dashboard/contract.py" = ["N815"]
"vintasend_api/dashboard/query.py" = ["N815"]
# The dotted name is the point: this file is copied to `vintasend_config.py`, never
# imported as it stands. It mirrors the TypeScript reference's
# `vintasend.config.example.ts`.
"vintasend_api/vintasend_config.example.py" = ["N999"]

[tool.mypy]
files = ["vintasend_api"]
# Must track the MINIMUM Python in [tool.poetry.dependencies], so errors that only
# appear on the oldest interpreter are not hidden.
python_version = "3.10"
show_error_codes = true
strict_equality = true
warn_no_return = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "vintasend_api.settings"
