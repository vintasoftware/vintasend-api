openapi: 3.1.0
info:
  title: VintaSend Dashboard API
  version: 1.0.0
  description: |
    HTTP contract between a VintaSend notification service and the VintaSend
    dashboard UI.

    This document is the source of truth for the contract. The TypeScript server
    in this repository implements it; any other implementation (for example one
    backed by the Python `vintasend` package) must match it exactly so the same
    dashboard UI can consume either.

    Conventions:
      * All timestamps are ISO-8601 strings in UTC, and are `null` when unset.
      * `page` is 1-indexed in the API, in every implementation of this contract,
        and clients never convert. Backends are not consistent about this — the
        TypeScript VintaSend backends are 0-indexed while the Python ones are
        1-indexed — so a server must read its backend's `pagination.oneIndexed`
        capability rather than copy another implementation's offset. That
        capability is backend-facing and is not published on the wire.
      * Every non-2xx response uses the `ErrorResponse` envelope, and every 400
        carries `details.issues`, a list of `{ path, message }`: `path` names
        the offending field, and is empty for the body as a whole.
      * Request bodies are JSON. A request that declares `application/json` (or
        any `application/*+json`) must carry valid JSON, so an empty body there
        is a 400. A request that declares no media type, or another one, counts
        as an omitted body when its body is empty, and is a 400 otherwise.
      * `hasMore` is true when the next page has at least one row, so a list
        that exactly fills its last page never offers an empty one.
  license:
    name: MIT
servers:
  - url: http://localhost:3333
    description: Local development
security:
  - apiKey: []
tags:
  - name: notifications
  - name: system

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, apiVersion]
                properties:
                  status:
                    type: string
                    enum: [ok]
                  apiVersion:
                    type: string
                    example: v1

  /api/v1/capabilities:
    get:
      tags: [system]
      summary: Filter capabilities of the configured backend
      description: |
        Flat dotted capability keys (for example `orderBy.sentAt`,
        `stringLookups.includes`). Consumers use this to hide sorting and
        filtering affordances the backend cannot honour. Missing keys mean
        "supported".

        Only capabilities a client can act on appear here. Capabilities that
        describe how the server talks to its backend — the `pagination.*`
        namespace, which reports how the backend numbers its pages — are filtered
        out, because the API's own `page` parameter is 1-indexed either way and a
        client that saw them might convert a second time.

        The map also carries the backend's optional notification actions, always
        all four and always explicit, because for these a missing key would mean
        "unsupported": `repin.expectedVersion`, `requeue.expectedVersion`,
        `requeue.templateVersion` and `versions.filter`.
      responses:
        '200':
          description: Capability map.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties:
                      type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: List notifications
      description: |
        Filters are combined with AND. String filters (`bodyTemplate`,
        `subjectTemplate`, `contextName`) are matched with the most precise
        lookup the backend supports: case-insensitive `includes` when available,
        otherwise a case-insensitive exact match, otherwise a plain equality
        match. The template-version filters match exactly and never match a
        notification whose version is null. Ordering defaults to `createdAt desc`,
        and is dropped when the backend reports it cannot order by the requested
        field.
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - name: notificationType
          in: query
          schema:
            $ref: '#/components/schemas/NotificationType'
        - name: adapterUsed
          in: query
          schema: { type: string, minLength: 1 }
        - name: userId
          in: query
          schema: { type: string, minLength: 1 }
        - name: bodyTemplate
          in: query
          schema: { type: string, minLength: 1 }
        - name: subjectTemplate
          in: query
          schema: { type: string, minLength: 1 }
        - name: contextName
          in: query
          schema: { type: string, minLength: 1 }
        - name: tenant
          in: query
          schema: { type: string, minLength: 1 }
        - name: requestedTemplateVersion
          in: query
          description: >-
            Notifications pinned to this template version. Unpinned notifications never
            match, since a null version is not version zero.
          schema: { type: integer, minimum: 0 }
        - name: usedTemplateVersion
          in: query
          description: >-
            Notifications that rendered this template version. Notifications that have not
            been sent, and those whose renderer has no versions, never match.
          schema: { type: integer, minimum: 0 }
        - name: createdAtFrom
          in: query
          schema: { type: string, format: date-time }
        - name: createdAtTo
          in: query
          schema: { type: string, format: date-time }
        - name: sentAtFrom
          in: query
          schema: { type: string, format: date-time }
        - name: sentAtTo
          in: query
          schema: { type: string, format: date-time }
        - name: orderByField
          in: query
          schema:
            type: string
            enum: [sendAfter, sentAt, readAt, createdAt, updatedAt]
        - name: orderByDirection
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          $ref: '#/components/responses/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/notifications/pending:
    get:
      tags: [notifications]
      summary: List notifications awaiting send
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          $ref: '#/components/responses/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/notifications/future:
    get:
      tags: [notifications]
      summary: List notifications scheduled for the future
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          $ref: '#/components/responses/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/notifications/one-off:
    get:
      tags: [notifications]
      summary: List one-off notifications
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
      responses:
        '200':
          $ref: '#/components/responses/NotificationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/notifications/{id}:
    get:
      tags: [notifications]
      summary: Get one notification with its context payloads
      description: |
        Looks the id up as a user notification first, then as a one-off one.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/notifications/{id}/preview:
    get:
      tags: [notifications]
      summary: Render the notification's templates
      description: |
        Fetches the body and subject templates from the template source at the
        commit SHA persisted with the notification, then renders them with the
        stored context (or regenerates the context when none was stored).
        Notifications that are still `PENDING_SEND` and have no stored SHA fall
        back to the current `main` commit.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: Rendered templates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/NotificationPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            No commit SHA is available for this notification, so its templates
            cannot be resolved (`PREVIEW_UNAVAILABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: |
            The template source could not be reached, or refused the request —
            for example a rate limit, a revoked token, or a template file that
            does not exist at that commit (`UPSTREAM_ERROR`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/{id}/resend:
    post:
      tags: [notifications]
      summary: Resend a notification
      description: |
        Creates a new notification based on an existing one. Only user
        notifications that have already been sent or failed can be resent.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                useStoredContext:
                  type: boolean
                  default: false
                  description: |
                    Reuse the context stored with the original notification
                    instead of regenerating it from current data.
      responses:
        '201':
          description: The newly created notification.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/UserNotification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The notification cannot be resent — it does not exist, is a one-off
            notification, or is scheduled for the future (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/{id}/cancel:
    post:
      tags: [notifications]
      summary: Cancel a pending notification
      parameters:
        - $ref: '#/components/parameters/notificationId'
      responses:
        '200':
          description: The notification was cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string }
                      status:
                        $ref: '#/components/schemas/NotificationStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The notification is not in `PENDING_SEND` status (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/{id}/requeue:
    post:
      tags: [notifications]
      summary: Requeue a failed or cancelled notification
      description: |
        Puts a `FAILED` or `CANCELLED` notification back into `PENDING_SEND`.
        The notification keeps its ID, content and template pin, so this
        retries the same notification, where `resend` creates a new one. When
        it is due (`sendAfter` is `null` or in the past) it is sent right away,
        unless `send` is `false`. Backends that delete cancelled notifications
        only requeue failed ones.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sendAfter:
                  type: [string, 'null']
                  format: date-time
                  description: |
                    When to send it. Omitted, the notification keeps its own
                    `sendAfter`; `null` sends it as soon as it is requeued.
                templateVersion:
                  type: integer
                  minimum: 0
                  description: |
                    Pin this template version in the same write that requeues
                    it. Needs `requeue.templateVersion` in `/capabilities`.
                expectedVersion:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: |
                    Requeue only if the notification is still at this version,
                    the token `POST /api/v1/notifications/versions` returned for
                    it. Needs `requeue.expectedVersion`.
                send:
                  type: boolean
                  description: |
                    `false` leaves the notification pending for whatever sends
                    pending notifications, even when it is due. Defaults to
                    `true`.
      responses:
        '200':
          description: |
            The notification as it stands after any send the request started:
            `SENT` when it went out, `FAILED` when the adapter failed,
            `PENDING_SEND` when it is waiting.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused (`CONFLICT`), with `details.reason`: `INVALID_STATUS` when
            the notification is not `FAILED` or `CANCELLED`, `CHANGED` when it
            is no longer at `expectedVersion`, `UNSUPPORTED` when the backend
            cannot honour `templateVersion`, `expectedVersion` or `send`.
            Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/{id}/repin:
    post:
      tags: [notifications]
      summary: Pin a notification to a template version
      description: |
        Sets `requestedTemplateVersion`, by default to the version the
        template renderer reports as current. Use it after publishing a fixed
        template to move notifications that have not been delivered onto it.
        Allowed in `PENDING_SEND`, `FAILED` and `CANCELLED`. It neither sends
        nor changes the status; to pin and requeue a failed notification in
        one write, pass `templateVersion` to requeue instead. Repinning to the
        version already pinned changes nothing.
      parameters:
        - $ref: '#/components/parameters/notificationId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                templateVersion:
                  type: integer
                  minimum: 0
                  description: |
                    Pin this version instead of the current one. It is not
                    checked against the template source.
                expectedVersion:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: |
                    Repin only if the notification is still at this version.
                    Needs `repin.expectedVersion` in `/capabilities`.
      responses:
        '200':
          description: The notification with its new pin.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused (`CONFLICT`), with `details.reason`: `INVALID_STATUS` when
            the notification was already delivered, `NO_TEMPLATE_VERSION` when
            no version was given and the renderer reports none, `CHANGED` when
            it is no longer at `expectedVersion`, `UNSUPPORTED` when the
            backend cannot check `expectedVersion`. Nothing is written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/notifications/versions:
    post:
      tags: [notifications]
      summary: Find notifications by ID and version, without their content
      description: |
        Returns `{ id, version }` for every notification matching `filter`,
        ordered by ID, and nothing else: the backend reads no recipient,
        context or rendered content to answer. Use it to count or select
        notifications, then pass `version` as `expectedVersion` to requeue or
        repin each one only if it has not changed since.

        `filter` is VintaSend's composable filter: a set of fields (ANDed), or
        `{ and: [...] }`, `{ or: [...] }`, `{ not: ... }`, nesting at most six
        levels. Strings match exactly and dates are ISO-8601. A filter the
        backend reports it cannot run (see `/capabilities`) is a 400 naming
        what it cannot do.

        Requeuing or repinning what this returns changes what matches, so list
        again from page 1 rather than moving on to the next page.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filter:
                  $ref: '#/components/schemas/NotificationSearchFilter'
                page:
                  type: integer
                  minimum: 1
                  default: 1
                pageSize:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
            example:
              filter:
                and:
                  - bodyTemplate: welcome
                  - or:
                      - and:
                          - status: PENDING_SEND
                            hasSendAfter: true
                            hasRequestedTemplateVersion: true
                          - not:
                              requestedTemplateVersion: 4
                      - status: FAILED
      responses:
        '200':
          description: One page of IDs and version tokens.
          content:
            application/json:
              schema:
                type: object
                required: [data, page, pageSize, hasMore]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, version]
                      properties:
                        id: { type: string }
                        version:
                          type: string
                          description: Opaque; compare for equality only.
                  page: { type: integer }
                  pageSize: { type: integer }
                  hasMore: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            The backend cannot list notification versions (`CONFLICT`, with
            `details.reason` `UNSUPPORTED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        Shared secret configured as `VINTASEND_API_KEY` for the standalone
        server. The dashboard calls the API from its server side only, so the
        key is never exposed to a browser. A host that mounts the API inside its
        own server authenticates callers its own way instead.

  parameters:
    page:
      name: page
      in: query
      description: |
        1-indexed page number: `page=1` is the first page. Translating this to
        the backend's own numbering is the server's job.
      schema: { type: integer, minimum: 1, default: 1 }
    pageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    notificationId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    NotificationPage:
      description: A page of notifications.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PaginatedNotifications'
    BadRequest:
      description: |
        The request failed validation (`BAD_REQUEST`). `details.issues` lists
        what was wrong.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        No valid credential was presented — a missing or wrong API key, or
        whatever the host's authentication refuses (`UNAUTHORIZED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: |
        The caller is authenticated and not allowed to do this (`FORBIDDEN`).
        Answered by a host's own authentication; the API key never produces
        it. Unlike a 401, it is not a reason to sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No such notification (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    NotificationStatus:
      type: string
      enum: [PENDING_SEND, SENT, FAILED, READ, CANCELLED]

    NotificationType:
      type: string
      enum: [EMAIL, SMS, PUSH, IN_APP]

    NotificationAttachment:
      type: object
      required: [id, filename, contentType, size]
      properties:
        id: { type: string }
        filename: { type: string }
        contentType: { type: string }
        size: { type: integer }
        description: { type: string }

    NotificationBase:
      type: object
      required:
        - id
        - kind
        - notificationType
        - title
        - contextName
        - status
        - sendAfter
        - sentAt
        - readAt
        - createdAt
        - updatedAt
        - adapterUsed
        - bodyTemplate
        - subjectTemplate
        - gitCommitSha
        - requestedTemplateVersion
        - usedTemplateVersion
        - tenant
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [user, one-off]
          description: Discriminates the two notification variants.
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: [string, 'null']
        contextName: { type: string }
        status:
          $ref: '#/components/schemas/NotificationStatus'
        sendAfter:
          type: [string, 'null']
          format: date-time
        sentAt:
          type: [string, 'null']
          format: date-time
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
        adapterUsed:
          type: [string, 'null']
        bodyTemplate: { type: string }
        subjectTemplate:
          type: [string, 'null']
        gitCommitSha:
          type: [string, 'null']
        requestedTemplateVersion:
          type: [integer, 'null']
          description: >-
            The template version this notification asked for, pinned when it was created or
            updated. Null means it was left unpinned and renders whatever version is current
            at send time. Always null when the service's template renderer has no versions.
        usedTemplateVersion:
          type: [integer, 'null']
          description: >-
            The template version the renderer reported after the notification was sent. Null
            until it has been sent, and always null when the template renderer has no
            versions. On an unpinned notification this is the only record of what went out.
        tenant:
          type: [string, 'null']

    UserNotification:
      allOf:
        - $ref: '#/components/schemas/NotificationBase'
        - type: object
          required: [userId]
          properties:
            kind:
              type: string
              enum: [user]
            userId: { type: string }

    OneOffNotification:
      allOf:
        - $ref: '#/components/schemas/NotificationBase'
        - type: object
          required: [emailOrPhone, firstName, lastName]
          properties:
            kind:
              type: string
              enum: [one-off]
            emailOrPhone: { type: string }
            firstName:
              type: [string, 'null']
            lastName:
              type: [string, 'null']

    Notification:
      oneOf:
        - $ref: '#/components/schemas/UserNotification'
        - $ref: '#/components/schemas/OneOffNotification'
      discriminator:
        propertyName: kind
        mapping:
          user: '#/components/schemas/UserNotification'
          one-off: '#/components/schemas/OneOffNotification'

    NotificationDetailFields:
      type: object
      required: [contextUsed, contextParameters, extraParams, attachments]
      properties:
        contextUsed:
          description: Context the notification was rendered with, when stored.
          nullable: true
        contextParameters:
          description: Parameters used to generate the context.
          nullable: true
        extraParams:
          nullable: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/NotificationAttachment'

    NotificationDetail:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/UserNotification'
            - $ref: '#/components/schemas/NotificationDetailFields'
        - allOf:
            - $ref: '#/components/schemas/OneOffNotification'
            - $ref: '#/components/schemas/NotificationDetailFields'

    NotificationSearchFilter:
      description: |
        A set of fields (ANDed), or a logical group. Strings match exactly;
        dates are ISO-8601.
      oneOf:
        - type: object
          additionalProperties: false
          required: [and]
          properties:
            and:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: '#/components/schemas/NotificationSearchFilter' }
        - type: object
          additionalProperties: false
          required: [or]
          properties:
            or:
              type: array
              minItems: 1
              maxItems: 50
              items: { $ref: '#/components/schemas/NotificationSearchFilter' }
        - type: object
          additionalProperties: false
          required: [not]
          properties:
            not: { $ref: '#/components/schemas/NotificationSearchFilter' }
        - $ref: '#/components/schemas/NotificationSearchFilterFields'

    NotificationSearchFilterFields:
      type: object
      additionalProperties: false
      properties:
        status:
          oneOf:
            - $ref: '#/components/schemas/NotificationStatus'
            - type: array
              items: { $ref: '#/components/schemas/NotificationStatus' }
        notificationType:
          oneOf:
            - { type: string, enum: [EMAIL, SMS, PUSH, IN_APP] }
            - type: array
              items: { type: string, enum: [EMAIL, SMS, PUSH, IN_APP] }
        adapterUsed:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        userId: { type: string }
        bodyTemplate: { type: string }
        subjectTemplate: { type: string }
        contextName: { type: string }
        tenant:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        requestedTemplateVersion:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: array, items: { type: integer, minimum: 0 } }
        usedTemplateVersion:
          oneOf:
            - { type: integer, minimum: 0 }
            - { type: array, items: { type: integer, minimum: 0 } }
        hasSendAfter:
          type: boolean
          description: '`true`: has a send time; `false`: has none.'
        hasRequestedTemplateVersion:
          type: boolean
          description: '`true`: pinned to some template version; `false`: unpinned.'
        sendAfterRange: { $ref: '#/components/schemas/DateRange' }
        createdAtRange: { $ref: '#/components/schemas/DateRange' }
        sentAtRange: { $ref: '#/components/schemas/DateRange' }
        readAtRange: { $ref: '#/components/schemas/DateRange' }

    DateRange:
      type: object
      additionalProperties: false
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }

    PaginatedNotifications:
      type: object
      required: [data, page, pageSize, hasMore]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        page: { type: integer }
        pageSize: { type: integer }
        hasMore:
          type: boolean
          description: |
            True when the next page has at least one row. Backends are not
            required to report a total count, so after a full page the server
            reads the one row that would come next.

    NotificationPreview:
      type: object
      required:
        - gitCommitSha
        - bodyTemplatePath
        - subjectTemplatePath
        - renderedBodyHtml
        - renderedSubjectHtml
      properties:
        gitCommitSha: { type: string }
        bodyTemplatePath: { type: string }
        subjectTemplatePath:
          type: [string, 'null']
        renderedBodyHtml: { type: string }
        renderedSubjectHtml: { type: string }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PREVIEW_UNAVAILABLE
                - UPSTREAM_ERROR
                - INTERNAL_ERROR
            message: { type: string }
            details:
              description: |
                Optional machine-readable context. Every 400 carries `issues`, a
                list of `{ path, message }`, and may carry other keys beside it.
                A refused requeue or repin, and a versions search the backend
                cannot run, carry `reason` (`INVALID_STATUS`,
                `NO_TEMPLATE_VERSION`, `CHANGED`, `UNSUPPORTED`, or `NOT_FOUND`
                on a 404).
